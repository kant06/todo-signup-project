<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 일정 관리</title>
<link rel="stylesheet" href="todo.css">
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <h1>업무 일정 관리</h1>
    <p class="sub">To-Do List</p>
  </header>

  <main>
    <form class="card" id="taskForm" novalidate>
      <h2>일정 추가</h2>
      <div class="form-row">
        <div class="field grow">
          <label for="taskTitle">일정 제목<span class="req">*</span></label>
          <input type="text" id="taskTitle" placeholder="예) 사내 시스템 교육 참석" maxlength="60" aria-describedby="titleMsg">
          <p class="field-msg" id="titleMsg" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="taskDate">날짜<span class="req">*</span></label>
          <input type="date" id="taskDate" aria-describedby="dateMsg">
          <p class="field-msg" id="dateMsg" aria-live="polite"></p>
        </div>
        <div class="field btn-field">
          <button type="submit" class="btn btn-primary" id="addBtn">+ 추가</button>
        </div>
      </div>
    </form>

    <section class="card list-card">
      <div class="list-head-row">
        <h2>일정 목록 <span class="count" role="status" aria-live="polite" aria-atomic="true">(총 <span id="taskCount">0</span>건)</span></h2>
        <label class="week-filter">
          <input type="checkbox" id="weekFilter">
          이번 주(오늘~7일) 일정만 보기
        </label>
      </div>
      <div class="ledger-head">
        <span>No.</span><span>제목</span><span>날짜</span><span>완료</span><span>삭제</span>
      </div>
      <div id="taskList"></div>
      <div class="empty" id="taskEmpty" role="status">
        <span class="big">🗒️</span>
        <span class="empty-text">아직 등록된 일정이 없습니다. 위에서 첫 일정을 추가해보세요.</span>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="alertModal" aria-hidden="true">
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-describedby="alertMsg">
      <p id="alertMsg" aria-live="assertive">필수 항목을 모두 입력해주세요.</p>
      <button type="button" class="btn btn-primary" id="alertCloseBtn">확인</button>
    </div>
  </div>

  <footer>To-Do List Module</footer>
</div>
<script src="todo.js"></script>
</body>
</html>
